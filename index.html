<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Картa Дня · Lunaria</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#080510;--deep:#120b1f;--plum:#22142f;
    --gold:#d9a94e;--gold-soft:#eccf94;--mist:#b7a4d6;--ink:#f4eeff;
    --line:rgba(217,169,78,.22);--glow:rgba(217,169,78,.45);
    --safe-top:0px;--safe-bottom:0px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;}
  html,body{height:100%;overscroll-behavior:none;}
  body{
    background:
      radial-gradient(ellipse 75% 55% at 50% -5%, rgba(96,55,135,.5), transparent 70%),
      radial-gradient(ellipse 60% 45% at 85% 105%, rgba(60,34,88,.55), transparent 70%),
      var(--void);
    color:var(--ink);font-family:'Jost',sans-serif;font-weight:300;
    min-height:100%;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  }
  input{-webkit-user-select:text;user-select:text;}
  .stars,.fog,.embers{position:fixed;inset:0;pointer-events:none;}
  .stars{z-index:0;}
  .star{position:absolute;background:#fff;border-radius:50%;animation:tw 5s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.1;}50%{opacity:.85;}}
  .fog{z-index:1;background:
      radial-gradient(circle at 20% 30%,rgba(120,80,160,.18),transparent 45%),
      radial-gradient(circle at 80% 60%,rgba(80,50,120,.18),transparent 45%);
    animation:drift 26s ease-in-out infinite alternate;}
  @keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1.1);}to{transform:translate3d(3%,2%,0) scale(1.25);}}
  .embers{z-index:2;}
  .ember{position:absolute;width:3px;height:3px;border-radius:50%;
    background:var(--gold-soft);box-shadow:0 0 8px var(--glow);bottom:-10px;
    animation:rise-e linear infinite;opacity:0;}
  @keyframes rise-e{0%{transform:translateY(0) translateX(0);opacity:0;}
    12%{opacity:.9;}88%{opacity:.7;}100%{transform:translateY(-104vh) translateX(30px);opacity:0;}}

  .app{position:relative;z-index:3;max-width:480px;margin:0 auto;
    padding:calc(18px + var(--safe-top)) 22px calc(116px + var(--safe-bottom));}

  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .brand{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.4em;
    text-transform:uppercase;color:var(--gold);font-weight:600;}
  .moon{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);
    margin:0 8px;vertical-align:middle;box-shadow:0 0 8px var(--gold);}
  .controls{display:flex;gap:7px;}
  .ctl{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    background:rgba(34,20,47,.7);color:var(--gold);cursor:pointer;font-size:14px;
    display:flex;align-items:center;justify-content:center;transition:.25s;
    font-family:'Jost',sans-serif;backdrop-filter:blur(6px);}
  .ctl:active{transform:scale(.92);}
  .ctl.lang{width:auto;padding:0 13px;border-radius:100px;font-size:11px;letter-spacing:.12em;font-weight:500;}

  .streak{margin:16px auto 0;display:flex;align-items:center;justify-content:center;gap:13px;
    background:rgba(34,20,47,.6);border:1px solid var(--line);border-radius:100px;
    padding:9px 20px;width:fit-content;backdrop-filter:blur(8px);}
  .streak b{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--gold-soft);font-weight:700;}
  .streak span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);}
  .streak .sep{width:1px;height:20px;background:var(--line);}

  .stage{margin-top:28px;perspective:1500px;display:flex;flex-direction:column;align-items:center;}
  /* halo is locked to the card size so nothing can shift it off-centre */
  .halo{position:relative;width:222px;height:360px;}
  .halo::before{content:"";position:absolute;inset:-44px;border-radius:50%;
    background:radial-gradient(circle,var(--glow),transparent 68%);opacity:0;transition:opacity 1.3s ease;}
  .halo.lit::before{opacity:.55;animation:breathe 4.5s ease-in-out infinite;}
  @keyframes breathe{0%,100%{opacity:.32;}50%{opacity:.62;}}

  /* 3-state card: closed → arcanum (face B) → advice (face A swapped to advice content).
     Rotation grows monotonically by 180deg so every flip reads as "turn the page". */
  .card{position:absolute;inset:0;transform-style:preserve-3d;
    transition:transform 1.15s cubic-bezier(.6,.04,.2,1);cursor:pointer;}
  .card[data-state="closed"]{transform:rotateY(0deg);}
  .card[data-state="arcanum"]{transform:rotateY(180deg);}
  .card[data-state="advice"]{transform:rotateY(360deg);}
  .card.hidden{opacity:0;pointer-events:none;}
  /* onboarding wiggle — runs once after the first reveal to hint that the card flips */
  @keyframes wiggle{
    0%{transform:rotateY(180deg);}
    25%{transform:rotateY(168deg) translateZ(6px);}
    55%{transform:rotateY(190deg) translateZ(2px);}
    100%{transform:rotateY(180deg);}
  }
  .card.wiggle{animation:wiggle 1.5s cubic-bezier(.45,.05,.25,1) 1;}

  /* ---- shuffle deck: stack of dummy cards driven entirely by JS transforms ---- */
  .deck{position:absolute;inset:0;pointer-events:none;}
  .deck.gone{display:none;}
  .dcard{position:absolute;inset:0;border-radius:18px;border:1px solid var(--line);
    background:
      repeating-linear-gradient(45deg,rgba(217,169,78,.07) 0 10px,transparent 10px 20px),
      linear-gradient(160deg,var(--plum),var(--deep));
    box-shadow:0 18px 40px -16px rgba(0,0,0,.8),inset 0 0 50px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;
    will-change:transform;
    /* a single transition handles every phase — no keyframes, no conflicts */
    transition:transform .6s cubic-bezier(.45,.05,.25,1),
               box-shadow .6s ease, opacity .4s ease;}
  .dcard.chosen{box-shadow:0 30px 60px -14px rgba(217,169,78,.5),inset 0 0 50px rgba(0,0,0,.5);}
  .dcard .dmark{width:64px;height:64px;border:1px solid rgba(217,169,78,.55);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:20px;color:var(--gold);transition:box-shadow .5s ease,border-color .5s ease;}
  .dcard.chosen .dmark{box-shadow:0 0 22px var(--glow);border-color:var(--gold);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;
    overflow:hidden;border:1px solid var(--line);}
  /* face A — deck-back design (pre-draw) and advice page (after draw), swapped via data-content */
  .back{display:flex;align-items:center;justify-content:center;
    box-shadow:0 26px 56px -18px rgba(0,0,0,.85),inset 0 0 60px rgba(0,0,0,.55);
    background:
      repeating-linear-gradient(45deg,rgba(217,169,78,.07) 0 10px,transparent 10px 20px),
      linear-gradient(160deg,var(--plum),var(--deep));}
  .back[data-content="advice"]{
    background:
      radial-gradient(ellipse at 50% -10%,rgba(96,55,135,.35),transparent 65%),
      linear-gradient(170deg,#2b1840,#120c25 70%,#0b0617);}
  .back-deck,.back-advice{position:absolute;inset:0;display:flex;}
  .back[data-content="deck"] .back-advice{display:none;}
  .back[data-content="advice"] .back-deck{display:none;}
  .back-deck{align-items:center;justify-content:center;}
  .sigil{width:116px;height:116px;border:1px solid var(--gold);border-radius:50%;
    display:flex;align-items:center;justify-content:center;position:relative;}
  .sigil::before{content:"";position:absolute;inset:12px;border:1px solid rgba(217,169,78,.4);border-radius:50%;}
  .sigil::after{content:"";position:absolute;inset:-14px;border:1px dashed rgba(217,169,78,.28);
    border-radius:50%;animation:spin 30s linear infinite;}
  .sigil span{font-size:38px;animation:spin 24s linear infinite reverse;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* advice page on the back of the card */
  .back-advice{flex-direction:column;padding:16px 14px 14px;align-items:stretch;text-align:center;}
  .advice-top{display:flex;justify-content:flex-end;font-size:8.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--mist);margin-bottom:4px;opacity:.85;}
  .advice-back-hint::before{content:"↺ ";color:var(--gold);}
  .advice-name{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:17px;
    color:var(--gold-soft);line-height:1.1;margin-top:2px;}
  .advice-divider{display:flex;align-items:center;gap:8px;margin:7px 6px 9px;color:var(--gold);font-size:13px;}
  .advice-divider::before,.advice-divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .advice-label{font-size:8.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:7px;}
  .advice-text{font-family:'Cormorant Garamond',serif;font-size:13px;line-height:1.55;
    color:var(--ink);flex:1;overflow-y:auto;text-align:left;padding:0 2px;}
  .advice-text::-webkit-scrollbar{width:3px;}
  .advice-text::-webkit-scrollbar-thumb{background:rgba(217,169,78,.25);border-radius:3px;}
  .advice-chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;
    margin-top:9px;padding-top:9px;border-top:1px solid var(--line);}
  .advice-chips .chip{font-size:8px;padding:2px 7px;}

  /* face B — arcanum front */
  .front{transform:rotateY(180deg);background:linear-gradient(165deg,#301d4a,#150c25);
    display:flex;padding:18px;box-shadow:0 26px 56px -18px rgba(0,0,0,.85);}
  .front .frame{flex:1;border:1px solid var(--line);border-radius:11px;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:18px 12px 10px;gap:8px;text-align:center;
    background:radial-gradient(ellipse at 50% 25%,rgba(217,169,78,.1),transparent 70%);}
  .front .num{font-family:'Cormorant Garamond',serif;font-size:11.5px;letter-spacing:.32em;color:var(--gold);}
  .front .glyph{font-size:62px;filter:drop-shadow(0 0 18px var(--glow));
    animation:floaty 5s ease-in-out infinite;transition:transform .6s ease;margin:2px 0;}
  .front .glyph.rev{transform:rotate(180deg);}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
  .front .cname{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;line-height:1.05;}
  .front .pos{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
    padding:2px 9px;border-radius:100px;border:1px solid var(--line);color:var(--gold-soft);}
  .front-hint{margin-top:auto;font-size:9px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--mist);padding-top:6px;opacity:.8;animation:pulse 2.6s ease-in-out infinite;}
  .front-hint::before{content:"↻ ";color:var(--gold);}

  /* keyword chips (used on the front face and on the advice back) */
  .chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px;}
  .chip{font-family:'Jost',sans-serif;font-weight:400;
    font-size:9px;letter-spacing:.08em;text-transform:lowercase;color:var(--gold-soft);
    padding:3px 8px;border-radius:100px;border:1px solid var(--line);
    background:rgba(217,169,78,.05);white-space:nowrap;}

  .tap-hint{margin-top:22px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--mist);animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

  .panel{margin-top:26px;background:rgba(18,11,31,.74);border:1px solid var(--line);
    border-radius:20px;padding:24px;backdrop-filter:blur(10px);}
  .panel h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:23px;
    text-align:center;line-height:1.25;}
  .panel .sub{text-align:center;font-size:12px;color:var(--mist);margin:5px 0 18px;letter-spacing:.03em;}
  .moods{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;}
  .mood{width:60px;min-height:66px;border-radius:15px;border:1px solid var(--line);
    background:rgba(34,20,47,.6);cursor:pointer;transition:.2s;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:7px 3px;}
  .mood .me{font-size:24px;line-height:1;}
  .mood .ml{font-size:9.5px;letter-spacing:.03em;color:var(--mist);text-transform:lowercase;
    text-align:center;transition:.2s;}
  .mood:active{transform:scale(.94);}
  .mood.sel{border-color:var(--gold);background:rgba(217,169,78,.16);box-shadow:0 0 18px var(--glow);}
  .mood.sel .ml{color:var(--gold-soft);}

  .btn{display:block;width:100%;margin-top:20px;padding:15px;
    background:linear-gradient(120deg,var(--gold),var(--gold-soft));color:#1a0f2b;
    border:none;border-radius:100px;cursor:pointer;font-family:'Jost',sans-serif;
    font-weight:500;font-size:12px;letter-spacing:.2em;text-transform:uppercase;transition:.2s;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.32;cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line);}

  .reading{margin-top:22px;animation:rise .8s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
  .reading .focus-tag{display:block;width:fit-content;margin:0 auto 14px;font-size:10px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--mist);
    border:1px solid var(--line);border-radius:100px;padding:5px 15px;}
  .reading .kw{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;
    color:var(--gold-soft);text-align:center;margin-bottom:18px;}
  .seg{display:flex;gap:12px;padding:14px 4px;border-top:1px solid var(--line);}
  .seg:first-of-type{border-top:none;}
  .seg .si{font-size:20px;flex-shrink:0;width:26px;text-align:center;}
  .seg .sc h4{font-family:'Jost',sans-serif;font-weight:500;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
  .seg .sc p{font-size:14px;line-height:1.65;color:#ddd0f0;}
  .seg .sc .aff{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:var(--gold-soft);}

  .echo{margin-top:18px;border:1px dashed var(--line);border-radius:18px;padding:20px;text-align:center;}
  .echo .ico{font-size:24px;}
  .echo h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;margin:6px 0 4px;}
  .echo p{font-size:12px;color:var(--mist);margin-bottom:15px;line-height:1.5;}
  .echo-opts{display:flex;gap:8px;}
  .echo-opts button{flex:1;padding:12px 6px;border-radius:13px;border:1px solid var(--line);
    background:rgba(34,20,47,.6);color:var(--ink);font-family:'Jost',sans-serif;font-size:11px;
    cursor:pointer;transition:.2s;}
  .echo-opts button:active{transform:scale(.95);}
  .echo-locked .echo-opts{display:none;}
  .echo-lockmsg{font-size:12px;color:var(--gold-soft);font-style:italic;
    font-family:'Cormorant Garamond',serif;}
  .echo-done{font-size:14px;color:var(--gold-soft);font-style:italic;
    font-family:'Cormorant Garamond',serif;line-height:1.5;}

  nav{position:fixed;bottom:0;left:0;right:0;z-index:6;
    background:linear-gradient(transparent,var(--void) 34%);
    padding:22px 0 calc(20px + var(--safe-bottom));}
  .nav-inner{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;
    background:rgba(18,11,31,.93);border:1px solid var(--line);border-radius:100px;
    padding:8px;width:calc(100% - 44px);backdrop-filter:blur(12px);}
  .nav-inner button{flex:1;background:none;border:none;color:var(--mist);cursor:pointer;
    padding:10px 4px;border-radius:100px;font-family:'Jost',sans-serif;font-size:9px;
    letter-spacing:.07em;text-transform:uppercase;transition:.2s;
    display:flex;flex-direction:column;align-items:center;gap:4px;}
  .nav-inner button:active{transform:scale(.93);}
  .nav-inner button .ni{font-size:16px;}
  .nav-inner button.active{color:var(--gold);background:rgba(217,169,78,.13);}

  .view{display:none;}
  .view.on{display:block;animation:rise .5s ease both;}

  .grid-head{text-align:center;}
  .grid-head h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:27px;}
  .grid-head .prog{font-size:12px;color:var(--mist);letter-spacing:.05em;margin-top:2px;}
  .bar{height:5px;background:rgba(217,169,78,.14);border-radius:100px;margin:14px 0 22px;overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));
    border-radius:100px;transition:width .9s ease;box-shadow:0 0 10px var(--glow);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .slot{aspect-ratio:.66;border-radius:10px;border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:22px;}
  .slot.locked{background:rgba(34,20,47,.4);color:rgba(183,164,214,.22);}
  .slot.got{background:linear-gradient(160deg,#301d4a,#150c25);box-shadow:inset 0 0 20px rgba(217,169,78,.14);}
  .slot small{font-size:7px;letter-spacing:.05em;text-transform:uppercase;color:var(--mist);text-align:center;padding:0 2px;}

  .jrow{display:flex;align-items:center;gap:14px;background:rgba(18,11,31,.66);
    border:1px solid var(--line);border-radius:15px;padding:13px 15px;margin-bottom:10px;}
  .jrow .jg{font-size:28px;}
  .jrow .jm{flex:1;}
  .jrow .jm b{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;display:block;}
  .jrow .jm span{font-size:11px;color:var(--mist);letter-spacing:.03em;}
  .jrow .jhit{font-size:18px;}
  .empty{text-align:center;color:var(--mist);font-size:14px;padding:46px 20px;
    font-style:italic;font-family:'Cormorant Garamond',serif;}

  .week{background:radial-gradient(ellipse at 50% 0%,rgba(96,55,135,.4),transparent 70%),
      rgba(18,11,31,.8);border:1px solid var(--gold);border-radius:18px;
    padding:20px;margin-bottom:18px;}
  .week h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;
    text-align:center;margin-bottom:4px;}
  .week .wsub{text-align:center;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--mist);margin-bottom:14px;}
  .week .wrow{display:flex;justify-content:space-around;text-align:center;}
  .week .wrow div b{display:block;font-family:'Cormorant Garamond',serif;font-size:24px;
    color:var(--gold-soft);font-weight:700;}
  .week .wrow div span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);}

  .ach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .ach{display:flex;gap:11px;align-items:center;border:1px solid var(--line);
    border-radius:14px;padding:12px;background:rgba(18,11,31,.6);}
  .ach.locked{opacity:.4;}
  .ach.unlocked{box-shadow:inset 0 0 16px rgba(217,169,78,.13);border-color:rgba(217,169,78,.4);}
  .ach .ai{font-size:24px;}
  .ach .at b{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:600;display:block;line-height:1.15;}
  .ach .at span{font-size:9.5px;color:var(--mist);line-height:1.3;}

  .overlay{position:fixed;inset:0;z-index:20;background:rgba(4,2,9,.88);
    display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(7px);}
  .overlay.on{display:flex;}
  .sharecard{width:312px;border-radius:22px;padding:32px 28px;text-align:center;
    background:radial-gradient(ellipse at 50% 0%,rgba(96,55,135,.6),transparent 70%),
      linear-gradient(165deg,#301d4a,#0c0717);
    border:1px solid var(--gold);box-shadow:0 0 56px var(--glow);}
  .sharecard .sbrand{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.38em;
    text-transform:uppercase;color:var(--gold);}
  .sharecard .sglyph{font-size:74px;margin:16px 0 4px;filter:drop-shadow(0 0 18px var(--glow));}
  .sharecard .sglyph.rev{transform:rotate(180deg);}
  .sharecard .sname{font-family:'Cormorant Garamond',serif;font-size:31px;font-weight:700;}
  .sharecard .spos{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);margin-top:4px;}
  .sharecard .skw{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold-soft);
    font-size:15px;margin:8px 0 16px;}
  .sharecard .sdate{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mist);
    border-top:1px solid var(--line);padding-top:14px;}

  .namebox{width:320px;background:linear-gradient(165deg,#251636,#0e0819);
    border:1px solid var(--gold);border-radius:22px;padding:30px 26px;text-align:center;
    box-shadow:0 0 50px var(--glow);}
  .namebox .ng{font-size:42px;margin-bottom:8px;}
  .namebox h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:23px;margin-bottom:6px;}
  .namebox p{font-size:12px;color:var(--mist);margin-bottom:18px;line-height:1.5;}
  .namebox input{width:100%;height:46px;padding:0 16px;border-radius:12px;
    border:1px solid var(--line);background:rgba(34,20,47,.7);color:var(--ink);
    font-family:'Jost',sans-serif;font-size:16px;text-align:center;outline:none;
    -webkit-appearance:none;appearance:none;box-sizing:border-box;}
  .namebox input::placeholder{color:rgba(183,164,214,.45);font-weight:300;}
  .namebox input:focus{border-color:var(--gold);}

  .toast{position:fixed;bottom:calc(122px + var(--safe-bottom));left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--plum);border:1px solid var(--gold);color:var(--gold-soft);
    padding:11px 22px;border-radius:100px;font-size:12px;letter-spacing:.05em;
    opacity:0;transition:.35s;z-index:30;pointer-events:none;max-width:88%;text-align:center;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

  /* =========================================================
     PAIR view — энергетическая совместимость
     ========================================================= */
  .pair-form-panel{background:rgba(18,11,31,.74);border:1px solid var(--line);
    border-radius:20px;padding:22px 20px;backdrop-filter:blur(10px);margin-top:18px;}
  .pair-group{display:flex;flex-direction:column;gap:10px;}
  .pair-group-label{font-size:10px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--gold);text-align:center;margin-bottom:2px;}
  /* one shared baseline for every field so number inputs and the month select
     line up perfectly — iOS renders <select> taller than <input type=number>
     by default; an explicit height + padding fixes that.
     font-size MUST be ≥16px or iOS auto-zooms on focus. */
  .pair-input,.pair-dd,.pair-yy,.pair-mm{
    width:100%;height:46px;
    padding:0 14px;
    border-radius:12px;border:1px solid var(--line);
    background:rgba(34,20,47,.7);color:var(--ink);
    font-family:'Jost',sans-serif;font-size:16px;line-height:1.2;
    outline:none;-webkit-appearance:none;appearance:none;
    -webkit-user-select:text;user-select:text;
    box-sizing:border-box;}
  .pair-input:focus,.pair-dd:focus,.pair-yy:focus,.pair-mm:focus{border-color:var(--gold);}
  .pair-input::placeholder,.pair-dd::placeholder,.pair-yy::placeholder{
    color:rgba(183,164,214,.45);font-weight:300;}
  .pair-input,.pair-dd,.pair-yy{text-align:center;}
  /* center the visible value of the select too — most platforms support
     text-align-last; the regular text-align is a fallback for the rest */
  .pair-mm{text-align:center;text-align-last:center;
    padding-right:30px;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M0 0h10L5 6z' fill='%23d9a94e'/%3E%3C/svg%3E");
    background-position:right 12px center;background-size:10px 6px;background-repeat:no-repeat;}
  .pair-date{display:grid;grid-template-columns:64px 1fr 84px;gap:8px;}
  .pair-dd::-webkit-inner-spin-button,.pair-dd::-webkit-outer-spin-button,
  .pair-yy::-webkit-inner-spin-button,.pair-yy::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  .pair-divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--gold);font-size:14px;justify-content:center;}
  .pair-divider::before,.pair-divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .pair-err{color:#e8a4a4;font-size:13px;text-align:center;margin-top:12px;font-style:italic;}
  #pairBtn{margin-top:18px;}

  .pair-list-head{margin:28px 0 12px;font-size:10px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--mist);text-align:center;}
  #pairList:empty + br{display:none;}
  .pair-list-row{display:flex;align-items:center;gap:12px;background:rgba(18,11,31,.66);
    border:1px solid var(--line);border-radius:15px;padding:12px 14px;margin-bottom:10px;cursor:pointer;
    transition:.2s;}
  .pair-list-row:active{transform:scale(.98);}
  .pair-list-row .plr-ico{font-size:24px;color:var(--gold);width:34px;text-align:center;}
  .pair-list-row .plr-body{flex:1;min-width:0;}
  .pair-list-row .plr-body b{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;
    display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pair-list-row .plr-body span{font-size:11px;color:var(--mist);letter-spacing:.05em;}
  .pair-list-row .plr-score{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold-soft);font-weight:600;}

  .ghost-back{width:auto;padding:0 14px;height:34px;border-radius:100px;
    background:rgba(34,20,47,.7);color:var(--gold);border:1px solid var(--line);
    font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.12em;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;margin-bottom:18px;}
  .ghost-back:active{transform:scale(.96);}

  .pair-header{text-align:center;margin-bottom:18px;}
  .pair-tier{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.42em;
    text-transform:uppercase;color:var(--gold);font-weight:600;}
  .pair-harmonic{margin-top:4px;}
  .pair-harmonic b{font-family:'Cormorant Garamond',serif;font-size:50px;color:var(--gold-soft);
    font-weight:700;display:block;line-height:1;text-shadow:0 0 24px var(--glow);}
  .pair-harmonic span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--mist);display:block;margin-top:4px;}

  .pair-mirror{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px;
    margin:8px 0 22px;}
  .pair-card{background:linear-gradient(165deg,#301d4a,#150c25);
    border:1px solid var(--line);border-radius:15px;padding:14px 10px 14px;text-align:center;
    box-shadow:0 16px 36px -14px rgba(0,0,0,.7);
    display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;}
  .pair-card .pc-glyph{font-size:38px;filter:drop-shadow(0 0 14px var(--glow));margin-bottom:2px;
    animation:floaty 5s ease-in-out infinite;}
  .pair-card .pc-num{font-family:'Cormorant Garamond',serif;font-size:9px;letter-spacing:.3em;color:var(--gold);}
  /* reserve room for up to two lines so cards never end up at different heights */
  .pair-card .pc-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700;line-height:1.15;
    min-height:38px;display:flex;align-items:center;justify-content:center;
    word-break:break-word;hyphens:auto;}
  .pair-card .pc-who{font-size:10px;letter-spacing:.06em;color:var(--gold-soft);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;margin-top:2px;}
  .pair-card .pc-role{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11.5px;
    color:var(--mist);line-height:1.35;margin-top:auto;padding-top:6px;}

  .pair-sigil{position:relative;width:54px;align-self:center;
    display:flex;align-items:center;justify-content:center;color:var(--gold);}
  .pair-sigil span{font-size:24px;filter:drop-shadow(0 0 12px var(--glow));z-index:2;}
  .pair-sigil i{position:absolute;width:44px;height:44px;border:1px solid var(--gold);border-radius:50%;opacity:.45;}
  .pair-sigil i:nth-child(2){width:34px;height:34px;border-style:dashed;
    animation:spin 18s linear infinite;}
  .pair-sigil i:nth-child(3){width:54px;height:54px;
    animation:spin 30s linear infinite reverse;border-color:rgba(217,169,78,.25);}

  .pair-section-label{margin:24px 0 12px;font-size:9.5px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--gold);text-align:center;
    display:flex;align-items:center;gap:10px;}
  .pair-section-label::before,.pair-section-label::after{
    content:"";flex:1;height:1px;background:var(--line);}

  .pair-bars{display:flex;flex-direction:column;gap:11px;}
  .pair-bar{display:grid;grid-template-columns:24px auto 1fr 32px;gap:10px;align-items:center;}
  .pair-bar .pb-i{font-size:18px;text-align:center;}
  .pair-bar .pb-l{font-size:11.5px;letter-spacing:.08em;color:var(--ink);}
  .pair-bar .pb-track{height:6px;background:rgba(217,169,78,.12);border-radius:100px;overflow:hidden;}
  .pair-bar .pb-fill{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));
    border-radius:100px;box-shadow:0 0 10px var(--glow);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1);}
  .pair-bar .pb-n{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;
    color:var(--gold-soft);text-align:right;}
  .pair-bar .pb-c{grid-column:2/-1;font-size:11.5px;color:var(--mist);font-style:italic;
    font-family:'Cormorant Garamond',serif;line-height:1.4;margin-top:-2px;}

  .pair-karma-card{background:radial-gradient(ellipse at 50% 0%,rgba(96,55,135,.4),transparent 70%),
      rgba(18,11,31,.8);border:1px solid var(--gold);border-radius:18px;padding:20px 18px;text-align:center;}
  .pair-karma-card .pk-icon{font-size:34px;filter:drop-shadow(0 0 14px var(--glow));margin-bottom:6px;}
  .pair-karma-card .pk-title{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;
    color:var(--gold-soft);letter-spacing:.04em;}
  .pair-karma-card .pk-text{font-family:'Cormorant Garamond',serif;font-size:13.5px;line-height:1.55;
    color:var(--ink);margin-top:8px;}

  .pair-flags{display:flex;flex-direction:column;gap:10px;}
  .pair-flag{display:flex;gap:10px;align-items:flex-start;
    background:rgba(34,20,47,.5);border:1px solid var(--line);border-radius:13px;padding:12px 14px;}
  .pair-flag .pf-i{font-size:14px;color:#e0a86b;line-height:1.6;flex-shrink:0;}
  .pair-flag .pf-t{font-size:13px;line-height:1.5;color:#ddd0f0;}

  .pair-future{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:17px;line-height:1.5;color:var(--gold-soft);
    padding:18px 16px;border:1px dashed var(--line);border-radius:16px;}
  .pair-future::before{content:"« ";color:var(--gold);}
  .pair-future::after{content:" »";color:var(--gold);}

  .pair-advice{font-family:'Cormorant Garamond',serif;font-size:14px;line-height:1.6;
    color:var(--ink);padding:4px 4px;}

  .pair-actions{margin-top:24px;display:flex;flex-direction:column;gap:10px;}
  .pair-actions .btn{margin-top:0;}

  /* pair share card */
  .pair-sharecard{width:312px;border-radius:22px;padding:28px 24px;text-align:center;
    background:radial-gradient(ellipse at 50% 0%,rgba(96,55,135,.6),transparent 70%),
      linear-gradient(165deg,#301d4a,#0c0717);
    border:1px solid var(--gold);box-shadow:0 0 56px var(--glow);}
  .pair-sharecard .ps-brand{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.38em;
    text-transform:uppercase;color:var(--gold);}
  .pair-sharecard .ps-tier{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.36em;
    text-transform:uppercase;color:var(--gold);margin-top:18px;}
  .pair-sharecard .ps-harm{font-family:'Cormorant Garamond',serif;font-size:64px;color:var(--gold-soft);
    font-weight:700;line-height:1;margin:4px 0 10px;text-shadow:0 0 24px var(--glow);}
  .pair-sharecard .ps-row{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px 0;}
  .pair-sharecard .ps-row .psg{font-size:38px;filter:drop-shadow(0 0 14px var(--glow));}
  .pair-sharecard .ps-row .pss{font-size:22px;color:var(--gold);}
  .pair-sharecard .ps-names{font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--ink);
    margin-top:6px;}
  .pair-sharecard .ps-quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;
    color:var(--gold-soft);margin:14px 6px 0;line-height:1.45;}
  .pair-share-toggle{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:11px;color:var(--mist);}
  .pair-share-toggle input{accent-color:var(--gold);}

</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="fog"></div>
<div class="embers" id="embers"></div>

<div class="app">
  <div class="topbar">
    <div class="brand">Lunaria<span class="moon"></span><span data-t="kicker"></span></div>
    <div class="controls">
      <button class="ctl lang" id="langBtn" onclick="toggleLang()">UA</button>
      <button class="ctl" id="soundBtn" onclick="toggleSound()">♪</button>
    </div>
  </div>

  <div class="streak">
    <span>🔥</span>
    <div><b id="streakNum">0</b> <span data-t="streakLbl"></span></div>
    <div class="sep"></div>
    <div><b id="freezeNum">1</b> <span data-t="freezeLbl"></span></div>
  </div>

  <section class="view on" id="view-today">
    <div class="stage">
      <div class="halo" id="halo">
        <div class="deck gone" id="deck">
          <div class="dcard"><div class="dmark">✶</div></div>
          <div class="dcard"><div class="dmark">✶</div></div>
          <div class="dcard"><div class="dmark">✶</div></div>
          <div class="dcard"><div class="dmark">✶</div></div>
          <div class="dcard"><div class="dmark">✶</div></div>
        </div>
        <div class="card" id="card" data-state="closed" onclick="flipCard()">
          <!-- face A: visible at card rotation 0 / 360. Holds two contents that swap. -->
          <div class="face back" id="faceBack" data-content="deck">
            <div class="back-deck"><div class="sigil"><span>✶</span></div></div>
            <div class="back-advice" id="adviceWrap">
              <div class="advice-top">
                <span class="advice-back-hint" data-t="flipToFront"></span>
              </div>
              <div class="advice-name" id="aName">—</div>
              <div class="advice-divider"><span id="aGlyphMini">✶</span></div>
              <div class="advice-label" data-t="adviceLabel"></div>
              <div class="advice-text" id="aText">—</div>
              <div class="advice-chips" id="aChips"></div>
            </div>
          </div>
          <!-- face B: visible at card rotation 180. Arcanum / front side. -->
          <div class="face front">
            <div class="frame">
              <div class="num" id="fNum">—</div>
              <div class="glyph" id="fGlyph">✶</div>
              <div class="cname" id="fName">—</div>
              <div class="pos" id="fPos" style="display:none;"></div>
              <div class="chips" id="fChips"></div>
              <div class="front-hint" data-t="flipToBack"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="tap-hint" id="tapHint" style="display:none;" data-t="tapHint"></div>
    </div>

    <div class="panel" id="moodPanel">
      <h2 id="moodGreeting" data-t="moodTitle"></h2>
      <div class="sub" data-t="moodSub"></div>
      <div class="moods" id="moods">
        <div class="mood" data-m="love"><span class="me">💗</span><span class="ml" data-mood="love"></span></div>
        <div class="mood" data-m="work"><span class="me">⚡</span><span class="ml" data-mood="work"></span></div>
        <div class="mood" data-m="calm"><span class="me">🌙</span><span class="ml" data-mood="calm"></span></div>
        <div class="mood" data-m="worry"><span class="me">🌫️</span><span class="ml" data-mood="worry"></span></div>
        <div class="mood" data-m="hope"><span class="me">✨</span><span class="ml" data-mood="hope"></span></div>
      </div>
      <button class="btn" id="drawBtn" disabled onclick="drawCard()" data-t="drawBtn"></button>
    </div>

    <div id="readingWrap" style="display:none;">
      <div class="reading">
        <span class="focus-tag" id="focusTag"></span>
        <div class="kw" id="rKw"></div>
        <div class="seg"><div class="si">⚠️</div><div class="sc">
          <h4 data-t="segAvoid"></h4><p id="rAvoid"></p></div></div>
        <div class="seg"><div class="si">🕊️</div><div class="sc">
          <h4 data-t="segAff"></h4><p class="aff" id="rAff"></p></div></div>
      </div>

      <div class="echo" id="echoBlock">
        <div class="ico">🌗</div>
        <h3 data-t="echoTitle"></h3>
        <p id="echoIntro" data-t="echoText"></p>
        <div class="echo-lockmsg" id="echoLock" style="display:none;"></div>
        <div class="echo-opts" id="echoOpts">
          <button onclick="echo('hit')" data-t="echoHit"></button>
          <button onclick="echo('part')" data-t="echoPart"></button>
          <button onclick="echo('miss')" data-t="echoMiss"></button>
        </div>
        <div class="echo-done" id="echoDone" style="display:none;"></div>
      </div>

      <button class="btn ghost" onclick="shareCard()" data-t="shareBtn"></button>
    </div>
  </section>

  <section class="view" id="view-collect">
    <div class="grid-head">
      <h2 data-t="collTitle"></h2>
      <div class="prog"><span id="collGot">0</span> <span data-t="collOf"></span></div>
    </div>
    <div class="bar"><i id="collBar" style="width:0%"></i></div>
    <div class="grid" id="collGrid"></div>
  </section>

  <section class="view" id="view-journal">
    <div class="grid-head">
      <h2 data-t="jrnTitle"></h2>
      <div class="prog" data-t="jrnSub"></div>
    </div>
    <div id="weekWrap" style="margin-top:20px;"></div>
    <div id="journalList"></div>
  </section>

  <section class="view" id="view-ach">
    <div class="grid-head">
      <h2 data-t="achTitle"></h2>
      <div class="prog"><span id="achGot">0</span> <span data-t="achOf"></span></div>
    </div>
    <div class="ach-grid" id="achGrid" style="margin-top:20px;"></div>
  </section>

  <section class="view" id="view-pair">
    <!-- form: shown when no current reading is open -->
    <div id="pairForm">
      <div class="grid-head">
        <h2 data-t="pairTitle"></h2>
        <div class="prog" data-t="pairSub"></div>
      </div>
      <div class="pair-form-panel">
        <div class="pair-group">
          <div class="pair-group-label" data-t="pairYou"></div>
          <input type="text" class="pair-input" id="pairName1" maxlength="24" autocomplete="off">
          <div class="pair-date">
            <input type="number" inputmode="numeric" class="pair-dd" id="pairDay1"   min="1" max="31">
            <select class="pair-mm" id="pairMon1"></select>
            <input type="number" inputmode="numeric" class="pair-yy" id="pairYear1" min="1900" max="2099">
          </div>
        </div>
        <div class="pair-divider"><span>✶</span></div>
        <div class="pair-group">
          <div class="pair-group-label" data-t="pairPartner"></div>
          <input type="text" class="pair-input" id="pairName2" maxlength="24" autocomplete="off">
          <div class="pair-date">
            <input type="number" inputmode="numeric" class="pair-dd" id="pairDay2"   min="1" max="31">
            <select class="pair-mm" id="pairMon2"></select>
            <input type="number" inputmode="numeric" class="pair-yy" id="pairYear2" min="1900" max="2099">
          </div>
        </div>
        <div class="pair-err" id="pairErr" style="display:none;"></div>
        <button class="btn" id="pairBtn" onclick="readPair()" data-t="pairBtn"></button>
      </div>

      <div id="pairListWrap">
        <div class="pair-list-head" data-t="pairListTitle"></div>
        <div id="pairList"></div>
      </div>
    </div>

    <!-- result: shown after the reading is computed -->
    <div id="pairResult" style="display:none;">
      <button class="ctl ghost-back" onclick="closePairResult()">← <span data-t="pairBack"></span></button>

      <div class="pair-header">
        <div class="pair-tier" id="pTier">—</div>
        <div class="pair-harmonic">
          <b id="pHarmonic">—</b>
          <span data-t="pairHarmonic"></span>
        </div>
      </div>

      <div class="pair-mirror">
        <div class="pair-card" id="pCard1">
          <div class="pc-glyph" id="pGlyph1">✶</div>
          <div class="pc-num"  id="pNum1">—</div>
          <div class="pc-name" id="pArc1">—</div>
          <div class="pc-who"  id="pWho1">—</div>
          <div class="pc-role" id="pRole1">—</div>
        </div>
        <div class="pair-sigil"><span>✶</span><i></i><i></i></div>
        <div class="pair-card" id="pCard2">
          <div class="pc-glyph" id="pGlyph2">✶</div>
          <div class="pc-num"  id="pNum2">—</div>
          <div class="pc-name" id="pArc2">—</div>
          <div class="pc-who"  id="pWho2">—</div>
          <div class="pc-role" id="pRole2">—</div>
        </div>
      </div>

      <div class="pair-section-label" data-t="pairElements"></div>
      <div class="pair-bars" id="pBars"></div>

      <div class="pair-section-label" data-t="pairKarma"></div>
      <div class="pair-karma-card" id="pKarmaCard">
        <div class="pk-icon"  id="pKarmaIcon">◐</div>
        <div class="pk-title" id="pKarmaTitle">—</div>
        <div class="pk-text"  id="pKarmaText">—</div>
      </div>

      <div class="pair-section-label" data-t="pairFlags"></div>
      <div class="pair-flags" id="pFlags"></div>

      <div class="pair-section-label" data-t="pairFuture"></div>
      <div class="pair-future" id="pFuture">—</div>

      <div class="pair-section-label" data-t="pairAdvice"></div>
      <div class="pair-advice" id="pAdvice">—</div>

      <div class="pair-actions">
        <button class="btn ghost" onclick="sharePair()" data-t="pairShare"></button>
        <button class="btn ghost" onclick="closePairResult()" data-t="pairNew"></button>

/* ============ Telegram Mini App init ============ */
const TG=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
function tgReady(){
  if(!TG) return;
  try{
    TG.ready();
    TG.expand();
    if(TG.disableVerticalSwipes) TG.disableVerticalSwipes();
    // dark theme to match the app
    try{TG.setHeaderColor('#080510');TG.setBackgroundColor('#080510');}catch(e){}
    applySafeArea();
    if(TG.onEvent) TG.onEvent('viewportChanged',applySafeArea);
  }catch(e){}
}
function applySafeArea(){
  if(!TG) return;
  // content safe area (avoids Telegram header / home indicator)
  const cs=TG.contentSafeAreaInset||{};
  const sa=TG.safeAreaInset||{};
  const top=(cs.top||0)+(sa.top||0);
  const bot=(cs.bottom||0)+(sa.bottom||0);
  document.documentElement.style.setProperty('--safe-top',top+'px');
  document.documentElement.style.setProperty('--safe-bottom',bot+'px');
}
/* haptic helpers — safe no-ops outside Telegram */
function hImpact(style){try{TG&&TG.HapticFeedback&&TG.HapticFeedback.impactOccurred(style);}catch(e){}}
function hNotify(type){try{TG&&TG.HapticFeedback&&TG.HapticFeedback.notificationOccurred(type);}catch(e){}}
function hSelect(){try{TG&&TG.HapticFeedback&&TG.HapticFeedback.selectionChanged();}catch(e){}}

/* ============ persistence — Telegram CloudStorage + localStorage fallback ============ */
const KEY='lunaria_v1';
let memStore=null;
function loadLocal(){
  try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return memStore;}
}
function saveState(){
  const data=JSON.stringify(S);
  try{localStorage.setItem(KEY,data);}catch(e){memStore=JSON.parse(data);}
  // mirror to Telegram cloud (syncs across the user's devices)
  try{if(TG&&TG.CloudStorage) TG.CloudStorage.setItem(KEY,data);}catch(e){}
}
/* CloudStorage is async — load it, merge, then boot */
function loadCloudThen(cb){
  if(TG&&TG.CloudStorage&&TG.CloudStorage.getItem){
    let done=false;
    const finish=val=>{if(done)return;done=true;cb(val);};
    try{
      TG.CloudStorage.getItem(KEY,(err,val)=>{
        if(!err&&val){try{finish(JSON.parse(val));return;}catch(e){}}
        finish(null);
      });
    }catch(e){finish(null);}
    setTimeout(()=>finish(null),1500); // network safety timeout
  }else cb(null);
}

/* ============ state ============ */
const today=new Date().toISOString().slice(0,10);
function dateDiff(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
const defaultState={
  name:null,lang:'uk',streak:0,freeze:1,lastDay:null,
  collected:[],echoCount:0,hitCount:0,achievements:[],

  drawnDate:null,journal:[],pairings:[]

let S=Object.assign({},defaultState,loadLocal()||{});
let LANG=S.lang||'uk';

/* ============ i18n apply ============ */
function applyLang(){
  const T=I18N[LANG];
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const k=el.dataset.t;if(T[k]!==undefined&&typeof T[k]==='string') el.textContent=T[k];
  });
  document.querySelectorAll('.ml').forEach(el=>{el.textContent=T.moodName[el.dataset.mood];});
  document.getElementById('nameInput').placeholder=T.namePlaceholder;
  document.getElementById('langBtn').textContent=LANG==='uk'?'UA':'RU';
  const g=document.getElementById('moodGreeting');
  g.textContent=S.name?T.moodTitleName(S.name):T.moodTitle;
  if(S.drawnToday!==null){fillFront(S.drawnToday);fillAdvice(S.drawnToday);showReading();}
  if(S.echoToday){
    const lm={hit:T.echoHit,part:T.echoPart,miss:T.echoMiss};
    document.getElementById('echoDone').textContent=T.echoDone(lm[S.echoToday]);
  }
  document.getElementById('echoLock').textContent=T.echoLock;
  renderCollection();renderJournal();renderAch();
  // pair view: re-localise month selects + list whenever language flips
  if(typeof fillMonths==='function') fillMonths();
  if(typeof renderPairList==='function') renderPairList();
  if(_currentPair) renderPair(_currentPair.p1,_currentPair.p2,_currentPair.r);
}

/* ============ streak ============ */
function evaluateStreak(){
  if(!S.lastDay) return;
  const gap=dateDiff(S.lastDay,today);
  if(gap<=1) return;
  if(gap===2 && S.freeze>0){S.freeze--;toast(I18N[LANG].freezeToast);}
  else if(gap>=2){S.streak=0;toast(I18N[LANG].resetToast);}
  saveState();
}

/* ============ draw — full shuffle ritual (JS-driven, no CSS keyframe conflicts) ============ */
function drawCard(){
  if(S.drawnDate===today){toast(I18N[LANG].alreadyToast);return;}
  unlockAudio();hImpact('medium');
  document.getElementById('drawBtn').disabled=true;

  const deck=document.getElementById('deck');
  const card=document.getElementById('card');
  const hint=document.getElementById('tapHint');
  const cards=Array.from(deck.querySelectorAll('.dcard'));

  // pre-pick the result — animation is pure presentation
  const idx=Math.floor(Math.random()*DECK.length);
  const reversed=Math.random()<0.5;

  // helper: set transform on one card
  const set=(el,x,y,rot,sc)=>{
    el.style.transform='translate('+x+'px,'+y+'px) rotate('+rot+'deg) scale('+(sc||1)+')';
  };
  // helper: put every card into a neat collapsed stack
  const toStack=()=>{
    const off=[[-3,3,-2],[2,2,1.5],[0,0,0],[-2,-2,-1],[3,-3,2]];
    cards.forEach((el,i)=>{el.style.opacity='1';el.classList.remove('chosen');
      set(el,off[i][0],off[i][1],off[i][2],1);});
  };

  // reveal the deck, start collapsed, no transition for the initial placement
  card.classList.add('hidden');
  deck.classList.remove('gone');
  cards.forEach(el=>{el.style.transition='none';});
  toStack();
  void deck.offsetWidth;                       // commit the start state
  cards.forEach(el=>{el.style.transition='';}); // re-enable transitions

  // PHASE 1 — fan out into an arc (starts ~60ms in, animates 0.6s)
  const fan=[[-130,14,-24],[-66,-2,-12],[0,-12,0],[66,-2,12],[130,14,24]];
  setTimeout(()=>{
    cards.forEach((el,i)=>set(el,fan[i][0],fan[i][1],fan[i][2],1));
    whoosh();
  },60);

  // PHASE 2 — riffle: two passes of cards crossing over each other
  // each pass is a single transform change → the shared transition makes it smooth
  setTimeout(()=>{
    cards.forEach((el,i)=>{const s=i%2?1:-1;set(el,s*40,-26,s*10,1);});
    whoosh();hImpact('light');
  },760);
  setTimeout(()=>{
    cards.forEach((el,i)=>{const s=i%2?1:-1;set(el,-s*40,26,-s*10,1);});
  },1180);
  setTimeout(()=>{
    cards.forEach((el,i)=>{const s=i%2?1:-1;set(el,s*30,-18,s*7,1);});
    hImpact('light');
  },1600);

  // PHASE 3 — collect back into a neat stack
  setTimeout(()=>{toStack();hImpact('soft');},2020);

  // PHASE 4 — the chosen (middle) card lifts out of the stack
  setTimeout(()=>{
    const chosen=cards[2];
    chosen.classList.add('chosen');
    set(chosen,0,-64,0,1.06);
    cards.forEach((el,i)=>{if(i!==2) el.style.opacity='.3';});
    softBell();hImpact('medium');
  },2620);

  // PHASE 5 — hide the deck, reveal the real card as the day's card
  setTimeout(()=>{
    deck.classList.add('gone');
    cards.forEach(el=>{el.classList.remove('chosen');el.style.opacity='';el.style.transform='';});
    card.classList.remove('hidden');

    S.drawnToday=idx;S.reversedToday=reversed;S.moodToday=selMood;S.drawnDate=today;
    S.streak=(S.streak||0)+1;S.lastDay=today;
    if(!S.collected.includes(idx)) S.collected.push(idx);
    S.journal.unshift({date:today,idx:idx,rev:reversed,mood:selMood,echo:null});
    document.getElementById('streakNum').textContent=S.streak;
    document.getElementById('freezeNum').textContent=S.freeze;
    fillFront(idx);
    fillAdvice(idx);
    // swap face A from deck-back design to advice page (hidden until card rotates past 270°)
    document.getElementById('faceBack').dataset.content='advice';
    // rotate from closed (deck back) to arcanum (front of the day's card)
    card.dataset.state='arcanum';
    document.getElementById('halo').classList.add('lit');
    document.getElementById('moodPanel').style.display='none';
    showReading();
    hint.style.display='block';
    // onboarding wiggle — runs once after the card settles, invites the first flip
    setTimeout(()=>{card.classList.add('wiggle');
      setTimeout(()=>card.classList.remove('wiggle'),1600);},1300);
    softBell();
    checkAch('first');
    if(S.streak>=7) checkAch('streak7');
    if(S.collected.length>=11) checkAch('half');
    if(S.collected.length>=22) checkAch('full');
    saveState();renderCollection();renderJournal();renderAch();
    toast(I18N[LANG].drawnToast);
  },3320);
}

function fillFront(idx){
  const c=DECK[idx],rev=S.reversedToday,L=c[LANG];
  document.getElementById('fNum').textContent='Аркан '+c.n;
  const gl=document.getElementById('fGlyph');
  gl.textContent=c.g;gl.classList.toggle('rev',rev);
  document.getElementById('fName').textContent=L.name;
  const pos=document.getElementById('fPos');
  // only show the position chip when reversed — otherwise the front breathes more
  if(rev){pos.style.display='block';pos.textContent=I18N[LANG].posRev;}
  else pos.style.display='none';
  renderChips('fChips',rev?L.kw3r:L.kw3);
}

function fillAdvice(idx){
  const c=DECK[idx],rev=S.reversedToday,L=c[LANG];
  document.getElementById('aName').textContent=L.name+(rev?' ⤵':'');
  document.getElementById('aGlyphMini').textContent=c.g;
  // "Совет на день" = essence (observation) + do (action) — one coherent paragraph
  document.getElementById('aText').textContent=
    (rev?L.re:L.e)+' '+(rev?L.rd:L.d);
  renderChips('aChips',rev?L.kw3r:L.kw3);
}

function renderChips(targetId,arr){
  const host=document.getElementById(targetId);
  host.innerHTML='';
  (arr||[]).forEach(k=>{
    const c=document.createElement('span');c.className='chip';c.textContent=k;
    host.appendChild(c);
  });
}

function flipCard(){
  if(S.drawnToday===null) return;
  const card=document.getElementById('card');
  const cur=card.dataset.state;
  if(cur==='closed') return;                   // never flip before the day's card is drawn
  const next=cur==='arcanum'?'advice':'arcanum';
  card.dataset.state=next;
  hImpact('medium');
  if(next==='advice'){chime();deepHit();}
  else softBell();
  // first interaction kills the standing tap hint and onboarding wiggle
  document.getElementById('tapHint').style.display='none';
  card.classList.remove('wiggle');
}

function showReading(){
  const c=DECK[S.drawnToday],rev=S.reversedToday,L=c[LANG],T=I18N[LANG];
  document.getElementById('focusTag').textContent=T.focus+': '+T.moodName[S.moodToday];
  document.getElementById('rKw').textContent='«'+L.kw+'»';
  document.getElementById('rAvoid').textContent=rev?L.ra:L.a;
  document.getElementById('rAff').textContent='«'+(rev?L.raf:L.af)+'»';
  document.getElementById('readingWrap').style.display='block';
  setupEcho();
}

/* ============ echo ============ */
function setupEcho(){
  const block=document.getElementById('echoBlock');
  const opts=document.getElementById('echoOpts');
  const lock=document.getElementById('echoLock');
  const done=document.getElementById('echoDone');
  const intro=document.getElementById('echoIntro');
  if(S.echoToday){
    opts.style.display='none';lock.style.display='none';intro.style.display='none';
    done.style.display='block';block.classList.remove('echo-locked');
    const T=I18N[LANG],lm={hit:T.echoHit,part:T.echoPart,miss:T.echoMiss};
    done.textContent=T.echoDone(lm[S.echoToday]);return;
  }
  const hour=new Date().getHours();
  if(hour<17){
    block.classList.add('echo-locked');
    lock.style.display='block';intro.style.display='none';done.style.display='none';
  }else{
    block.classList.remove('echo-locked');
    lock.style.display='none';intro.style.display='block';
    opts.style.display='flex';done.style.display='none';
  }
}
function echo(val){
  S.echoToday=val;S.echoCount=(S.echoCount||0)+1;
  if(val==='hit') S.hitCount=(S.hitCount||0)+1;
  if(S.journal[0]) S.journal[0].echo=val;
  document.getElementById('echoOpts').style.display='none';
  const T=I18N[LANG],lm={hit:T.echoHit,part:T.echoPart,miss:T.echoMiss};
  const d=document.getElementById('echoDone');
  d.style.display='block';d.textContent=T.echoDone(lm[val]);
  hImpact('light');softBell();
  if(S.echoCount>=5) checkAch('echo5');
  if(S.hitCount>=5) checkAch('hits5');
  saveState();renderJournal();
  toast(T.echoToast);
}

/* ============ achievements ============ */
function checkAch(id){
  if(S.achievements.includes(id)) return;
  S.achievements.push(id);saveState();
  const a=ACHS.find(x=>x.id===id);
  hNotify('success');softBell();
  toast(I18N[LANG].achToast(a[LANG].t));
  renderAch();
}
function renderAch(){
  const g=document.getElementById('achGrid');g.innerHTML='';
  ACHS.forEach(a=>{
    const got=S.achievements.includes(a.id);
    const d=document.createElement('div');
    d.className='ach '+(got?'unlocked':'locked');
    d.innerHTML=`<div class="ai">${got?a.i:'🔒'}</div>
      <div class="at"><b>${a[LANG].t}</b><span>${a[LANG].d}</span></div>`;
    g.appendChild(d);
  });
  document.getElementById('achGot').textContent=S.achievements.length;
}

  const sp=document.getElementById('sPos');

/* ===================================================================
   PREMIUM AMBIENT SOUND ENGINE — Web Audio, no external files.
   Designed for a calm, mystical, high-end feel:
   - low warm drone with slow-moving overtones
   - a convolution reverb (synthesised impulse) on every cue
   - soft mallet bells instead of plain sine beeps
   - gentle "whoosh" with a long fade, no harsh transient
   =================================================================== */
let AC=null,master=null,reverb=null,ambientGain=null,soundOn=false,ambientStarted=false;

function buildReverb(seconds,decay){
  const rate=AC.sampleRate,len=rate*seconds;
  const imp=AC.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){
    const d=imp.getChannelData(ch);
    for(let i=0;i<len;i++){
      d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
    }
  }
  const c=AC.createConvolver();c.buffer=imp;return c;
}

function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
  // shared reverb send — long, soft tail for a cathedral-like space
  reverb=buildReverb(4.5,2.6);
  const revGain=AC.createGain();revGain.gain.value=0.55;
  reverb.connect(revGain);revGain.connect(master);
  AC._revIn=reverb;
}
function unlockAudio(){
  initAudio();
  if(AC.state==='suspended') AC.resume();
  if(!ambientStarted){startAmbient();ambientStarted=true;}
}

/* warm evolving drone — three layers, very low volume */
function startAmbient(){
  ambientGain=AC.createGain();ambientGain.gain.value=0;
  ambientGain.connect(master);
  // a soft reverb send for the pad too
  const padRev=AC.createGain();padRev.gain.value=0.4;
  ambientGain.connect(padRev);padRev.connect(AC._revIn);
  // root + fifth + octave, slightly detuned, sine for warmth
  const freqs=[73.42,110.0,146.83,220.5];
  freqs.forEach((f,i)=>{
    const o=AC.createOscillator();o.type='sine';o.frequency.value=f;
    const g=AC.createGain();g.gain.value=0.07/(i*0.4+1);
    // slow amplitude shimmer so the pad gently breathes
    const lfo=AC.createOscillator();lfo.type='sine';
    lfo.frequency.value=0.05+i*0.017;
    const lg=AC.createGain();lg.gain.value=0.03;
    lfo.connect(lg);lg.connect(g.gain);
    // gentle low-pass keeps it soft, never harsh
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;
    o.connect(lp);lp.connect(g);g.connect(ambientGain);
    o.start();lfo.start();
  });
}

/* soft mallet bell — FM-ish, mellow attack, long reverb tail */
function bell(freq,t,vol){
  const o=AC.createOscillator();o.type='sine';o.frequency.value=freq;
  // a quiet partial an octave up adds shimmer without harshness
  const o2=AC.createOscillator();o2.type='sine';o2.frequency.value=freq*2.01;
  const g=AC.createGain();g.gain.value=0;
  const g2=AC.createGain();g2.gain.value=0;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
  o.connect(g);o2.connect(g2);
  g.connect(lp);g2.connect(lp);
  lp.connect(master);
  const send=AC.createGain();send.gain.value=0.6;
  lp.connect(send);send.connect(AC._revIn);
  // mellow attack (not a click), long exponential release
  g.gain.linearRampToValueAtTime(vol,t+0.04);
  g.gain.exponentialRampToValueAtTime(0.0001,t+2.8);
  g2.gain.linearRampToValueAtTime(vol*0.25,t+0.05);
  g2.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
  o.start(t);o2.start(t);o.stop(t+3);o2.stop(t+3);
}

/* card reveal — a calm ascending pentatonic phrase */
function chime(){
  if(!AC||!soundOn) return;
  const scale=[392.0,440.0,523.25,587.33,659.25]; // G A C D E — soft, no tension
  scale.forEach((f,i)=>bell(f,AC.currentTime+i*0.16,0.13));
}
/* small confirmation bell — single warm note */
function softBell(){
  if(!AC||!soundOn) return;
  bell(523.25,AC.currentTime,0.1);
}
/* deep resonant "opening" tone under the reveal */
function deepHit(){
  if(!AC||!soundOn) return;
  const o=AC.createOscillator();o.type='sine';o.frequency.value=98;
  const g=AC.createGain();g.gain.value=0;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;
  o.connect(lp);lp.connect(master);
  const send=AC.createGain();send.gain.value=0.5;lp.connect(send);send.connect(AC._revIn);
  const t=AC.currentTime;
  g.gain.linearRampToValueAtTime(0.18,t+0.08);
  g.gain.exponentialRampToValueAtTime(0.0001,t+2.2);
  o.connect(g);g.connect(master);
  o.start(t);o.stop(t+2.4);
}
/* shuffle — soft filtered noise swell, slow attack & release (no harsh hiss) */
function whoosh(){
  if(!AC||!soundOn) return;
  const dur=1.5;
  const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=0.8;
  // sweep the filter for a gentle "breath" rather than a "shh"
  bp.frequency.setValueAtTime(300,AC.currentTime);
  bp.frequency.linearRampToValueAtTime(900,AC.currentTime+dur*0.5);
  bp.frequency.linearRampToValueAtTime(280,AC.currentTime+dur);
  const g=AC.createGain();g.gain.value=0;
  const t=AC.currentTime;
  g.gain.linearRampToValueAtTime(0.16,t+0.5);   // slow swell in
  g.gain.linearRampToValueAtTime(0.0001,t+dur); // slow fade out
  src.connect(bp);bp.connect(g);g.connect(master);
  const send=AC.createGain();send.gain.value=0.4;g.connect(send);send.connect(AC._revIn);
  src.start();
}

function toggleSound(){
  unlockAudio();
  soundOn=!soundOn;
  if(ambientGain) ambientGain.gain.linearRampToValueAtTime(soundOn?0.6:0,AC.currentTime+1.4);
  const b=document.getElementById('soundBtn');
  b.textContent=soundOn?'♪':'♪̸';b.style.color=soundOn?'#eccf94':'#7a6a90';
  hSelect();
  if(soundOn) softBell();
}

/* ===================================================================
   PAIR — энергетическая совместимость двух людей
   Полностью детерминированный движок: одинаковый ввод → одинаковый
   результат. Все «случайности» производятся стабильным хэшем имени+ДР.
   =================================================================== */
function _pStrHash(s){
  let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  return h>>>0;
}
function _pNorm(s){return (s||'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');}
function _pPairKey(p1,p2,spice){
  // симметричный ключ — порядок партнёров не должен влиять на результат
  const a=_pNorm(p1.name)+'|'+p1.dob;
  const b=_pNorm(p2.name)+'|'+p2.dob;
  const lo=a<b?a:b,hi=a<b?b:a;
  return _pStrHash(lo+'~'+hi+'~'+spice);
}
function _pArcana(p){return _pStrHash(_pNorm(p.name)+'|'+p.dob+'|arcana')%22;}
function _pLifePath(dob){
  let n=dob.replace(/-/g,'').split('').map(Number).reduce((a,b)=>a+b,0);
  while(n>9 && n!==11 && n!==22 && n!==33){
    n=String(n).split('').map(Number).reduce((a,b)=>a+b,0);
  }
  return n;
}
// 55..95 — нарочно избегаем краёв 0 и 100: вердиктов «всё или ничего» не делаем
function _pScore(p1,p2,dim){return 55+(_pPairKey(p1,p2,dim)%41);}
function _pBucket(s){
  if(s<=62) return 0;
  if(s<=72) return 1;
  if(s<=82) return 2;
  if(s<=90) return 3;
  return 4;
}

function computePair(p1,p2){
  const scores={
    heart:_pScore(p1,p2,'heart'),
    fire :_pScore(p1,p2,'fire'),
    mind :_pScore(p1,p2,'mind'),
    karma:_pScore(p1,p2,'karma'),
    earth:_pScore(p1,p2,'earth')
  };
  // взвешенный индекс гармонии: карма и сердце — основной несущий слой
  const harmonic=Math.round(
    scores.heart*0.25+scores.fire*0.18+scores.mind*0.18+
    scores.karma*0.24+scores.earth*0.15
  );
  // 4 кармических уровня: 0..3 (попутчики/зеркала/родственные/близнецы пламени)
  const tierRaw=Math.round(scores.karma*0.7+scores.fire*0.3);
  let tier;
  if(tierRaw<=68) tier=0;
  else if(tierRaw<=78) tier=1;
  else if(tierRaw<=87) tier=2;
  else tier=3;
  // слово гармонии — 5 вариантов (полюса → зеркало)
  const harmonicWord=_pBucket(harmonic);
  // 3 уникальных red flag из банка
  const bank=PAIR.uk.redFlags.length;
  const seeds=['flag-a','flag-b','flag-c'].map(s=>_pPairKey(p1,p2,s));
  const flags=[];
  for(const seed of seeds){
    let idx=seed%bank;
    while(flags.includes(idx)) idx=(idx+1)%bank;
    flags.push(idx);
  }
  const future=_pPairKey(p1,p2,'future')%PAIR.uk.futurePhrases.length;
  return {
    arcana1:_pArcana(p1),arcana2:_pArcana(p2),
    lifePath1:_pLifePath(p1.dob),lifePath2:_pLifePath(p2.dob),
    scores,harmonic,harmonicWord,tier,flags,future
  };
}

/* ============ pair UI: form, list, result, share ============ */
let _currentPair=null;

function fillMonths(){
  const months=PAIR[LANG].months;
  ['pairMon1','pairMon2'].forEach(id=>{
    const sel=document.getElementById(id);
    const prev=sel.value;
    sel.innerHTML='';
    months.forEach((m,i)=>{
      const o=document.createElement('option');o.value=i+1;o.textContent=m;
      sel.appendChild(o);
    });
    if(prev) sel.value=prev;
  });
  // language-aware placeholders for the bare day / year inputs and name fields
  const dayPh='дд';
  const yearPh=LANG==='uk'?'рррр':'гггг';
  const namePh=LANG==='uk'?'Ім’я':'Имя';
  ['pairDay1','pairDay2'].forEach(id=>{document.getElementById(id).placeholder=dayPh;});
  ['pairYear1','pairYear2'].forEach(id=>{document.getElementById(id).placeholder=yearPh;});
  ['pairName1','pairName2'].forEach(id=>{document.getElementById(id).placeholder=namePh;});
}

function _validDob(d,m,y){
  const dd=+d,mm=+m,yy=+y;
  if(!dd||!mm||!yy) return false;
  if(yy<1900||yy>2099) return false;
  const dt=new Date(yy,mm-1,dd);
  return dt.getFullYear()===yy && dt.getMonth()===mm-1 && dt.getDate()===dd && dt<=new Date();
}
function _pad(n,w){n=String(n);while(n.length<w) n='0'+n;return n;}

function readPair(){
  const errEl=document.getElementById('pairErr');errEl.style.display='none';
  const T=I18N[LANG];
  const n1=document.getElementById('pairName1').value.trim();
  const n2=document.getElementById('pairName2').value.trim();
  if(!n1||!n2){errEl.textContent=T.pairErrName;errEl.style.display='block';hNotify('error');return;}
  const d1=document.getElementById('pairDay1').value;
  const m1=document.getElementById('pairMon1').value;
  const y1=document.getElementById('pairYear1').value;
  const d2=document.getElementById('pairDay2').value;
  const m2=document.getElementById('pairMon2').value;
  const y2=document.getElementById('pairYear2').value;
  if(!_validDob(d1,m1,y1)||!_validDob(d2,m2,y2)){
    errEl.textContent=T.pairErrDate;errEl.style.display='block';hNotify('error');return;
  }
  const dob1=_pad(y1,4)+'-'+_pad(m1,2)+'-'+_pad(d1,2);
  const dob2=_pad(y2,4)+'-'+_pad(m2,2)+'-'+_pad(d2,2);
  if(_pNorm(n1)===_pNorm(n2) && dob1===dob2){
    errEl.textContent=T.pairErrSelf;errEl.style.display='block';hNotify('error');return;
  }
  const p1={name:n1,dob:dob1};
  const p2={name:n2,dob:dob2};
  const r=computePair(p1,p2);
  // save (dedupe: replace existing reading for the same pair)
  S.pairings=S.pairings||[];
  const sig=[_pNorm(n1)+'|'+dob1,_pNorm(n2)+'|'+dob2].sort().join('~');
  S.pairings=S.pairings.filter(x=>x.sig!==sig);
  S.pairings.unshift({id:'p'+Date.now(),sig,p1,p2,r,createdAt:new Date().toISOString()});
  if(S.pairings.length>10) S.pairings.length=10;
  saveState();
  hImpact('medium');softBell();
  openPairResult(p1,p2,r);
  toast(T.pairSavedToast);
}

function openPairResult(p1,p2,r){
  _currentPair={p1,p2,r};
  renderPair(p1,p2,r);
  document.getElementById('pairForm').style.display='none';
  document.getElementById('pairResult').style.display='block';
  // scroll the app to the result
  window.scrollTo({top:0,behavior:'smooth'});
}

function closePairResult(){
  _currentPair=null;
  document.getElementById('pairForm').style.display='block';
  document.getElementById('pairResult').style.display='none';
  renderPairList();
  hSelect();
}

function renderPair(p1,p2,r){
  const L=PAIR[LANG];
  document.getElementById('pTier').textContent=L.harmonicWords[r.harmonicWord];
  document.getElementById('pHarmonic').textContent=r.harmonic;
  // arcana cards
  [[1,r.arcana1,p1],[2,r.arcana2,p2]].forEach(([n,arc,p])=>{
    const c=DECK[arc],cL=c[LANG];
    document.getElementById('pGlyph'+n).textContent=c.g;
    document.getElementById('pNum'+n).textContent='Аркан '+c.n;
    document.getElementById('pArc'+n).textContent=cL.name;
    document.getElementById('pWho'+n).textContent=p.name;
    document.getElementById('pRole'+n).textContent=L.arcanaRoles[arc];
  });
  // 5 bars
  const barsHost=document.getElementById('pBars');barsHost.innerHTML='';
  L.elements.forEach(el=>{
    const sc=r.scores[el.id],bk=_pBucket(sc);
    const row=document.createElement('div');row.className='pair-bar';
    row.innerHTML='<div class="pb-i">'+el.i+'</div>'+
      '<div class="pb-l">'+el.name+'</div>'+
      '<div class="pb-track"><i class="pb-fill" style="width:0%"></i></div>'+
      '<div class="pb-n">'+sc+'</div>'+
      '<div class="pb-c">'+el.phrases[bk]+'</div>';
    barsHost.appendChild(row);
    // animate fill on next tick so the transition kicks in
    requestAnimationFrame(()=>{row.querySelector('.pb-fill').style.width=sc+'%';});
  });
  // karma tier
  const t=L.karmaTiers[r.tier];
  document.getElementById('pKarmaIcon').textContent=t.icon;
  document.getElementById('pKarmaTitle').textContent=t.title;
  document.getElementById('pKarmaText').textContent=t.text;
  // flags
  const flagsHost=document.getElementById('pFlags');flagsHost.innerHTML='';
  r.flags.forEach(idx=>{
    const text=L.redFlags[idx].replace(/\{p1\}/g,p1.name).replace(/\{p2\}/g,p2.name);
    const el=document.createElement('div');el.className='pair-flag';
    el.innerHTML='<div class="pf-i">⚠</div><div class="pf-t">'+text+'</div>';
    flagsHost.appendChild(el);
  });
  document.getElementById('pFuture').textContent=L.futurePhrases[r.future];
  document.getElementById('pAdvice').textContent=L.coupleAdvice[r.tier];
}

function renderPairList(){
  const host=document.getElementById('pairList');
  const T=I18N[LANG],L=PAIR[LANG];
  host.innerHTML='';
  const list=S.pairings||[];
  if(!list.length){
    host.innerHTML='<div class="empty">'+T.pairListEmpty+'</div>';return;
  }
  const loc=LANG==='uk'?'uk-UA':'ru-RU';
  list.forEach(p=>{
    const dt=new Date(p.createdAt).toLocaleDateString(loc,{day:'numeric',month:'long'});
    const tier=L.karmaTiers[p.r.tier];
    const row=document.createElement('div');row.className='pair-list-row';
    row.innerHTML='<div class="plr-ico">'+tier.icon+'</div>'+
      '<div class="plr-body"><b>'+p.p1.name+' & '+p.p2.name+'</b>'+
      '<span>'+dt+' · '+tier.title+'</span></div>'+
      '<div class="plr-score">'+p.r.harmonic+'</div>';
    row.onclick=()=>{openPairResult(p.p1,p.p2,p.r);hImpact('light');};
    host.appendChild(row);
  });
}

function sharePair(){
  if(!_currentPair) return;
  const {p1,p2,r}=_currentPair;
  const L=PAIR[LANG],T=I18N[LANG];
  const c1=DECK[r.arcana1],c2=DECK[r.arcana2];
  const tier=L.karmaTiers[r.tier];
  const future=L.futurePhrases[r.future];
  const W=720,H=1100;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');
  const bg=x.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#301d4a');bg.addColorStop(1,'#0c0717');
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  const rg=x.createRadialGradient(W/2,0,0,W/2,0,W);
  rg.addColorStop(0,'rgba(96,55,135,.6)');rg.addColorStop(1,'rgba(96,55,135,0)');
  x.fillStyle=rg;x.fillRect(0,0,W,H);
  x.strokeStyle='#d9a94e';x.lineWidth=3;x.strokeRect(28,28,W-56,H-56);
  x.textAlign='center';
  x.fillStyle='#d9a94e';x.font='26px Cormorant Garamond, serif';
  x.fillText('LUNARIA · '+T.navPair.toUpperCase(),W/2,120);
  // tier label
  x.fillStyle='#d9a94e';x.font='22px Jost, sans-serif';
  x.fillText(tier.title.toUpperCase(),W/2,200);
  // harmonic
  x.fillStyle='#eccf94';x.font='bold 130px Cormorant Garamond, serif';
  x.fillText(String(r.harmonic),W/2,360);
  x.fillStyle='#b7a4d6';x.font='18px Jost, sans-serif';
  x.fillText(T.pairHarmonic.toUpperCase(),W/2,400);
  // two glyphs + sigil
  x.font='130px serif';x.fillStyle='#eccf94';
  x.fillText(c1.g,W/2-160,580);
  x.fillText(c2.g,W/2+160,580);
  x.fillStyle='#d9a94e';x.font='44px serif';
  x.fillText('✶',W/2,580);
  // arcana names
  x.fillStyle='#f4eeff';x.font='28px Cormorant Garamond, serif';
  x.fillText(c1[LANG].name,W/2-160,640);
  x.fillText(c2[LANG].name,W/2+160,640);
  // separator
  x.strokeStyle='rgba(217,169,78,.3)';x.lineWidth=1;
  x.beginPath();x.moveTo(140,720);x.lineTo(W-140,720);x.stroke();
  // future phrase — wrap to ~30 chars
  x.fillStyle='#eccf94';x.font='italic 28px Cormorant Garamond, serif';
  const words=future.split(' ');let line='',y=790;
  words.forEach(w=>{
    const test=line?line+' '+w:w;
    if(x.measureText(test).width>W-160){x.fillText(line,W/2,y);y+=42;line=w;}
    else line=test;
  });
  if(line) x.fillText(line,W/2,y);
  // date
  const dt=new Date().toLocaleDateString(LANG==='uk'?'uk-UA':'ru-RU',{day:'numeric',month:'long'});
  x.fillStyle='#b7a4d6';x.font='20px Jost, sans-serif';
  x.fillText(dt.toUpperCase(),W/2,H-80);
  // download
  const a=document.createElement('a');
  a.download='lunaria-pair-'+today+'.png';a.href=cv.toDataURL('image/png');a.click();
  hImpact('light');toast(T.savedToast);
}

/* hook the form inputs into "tap = unlock haptic" without losing focus */
['pairName1','pairName2','pairDay1','pairDay2','pairYear1','pairYear2'].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.addEventListener('focus',()=>hSelect());
});

/* ============ nav ============ */
function go(v,btn){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  document.getElementById('view-'+v).classList.add('on');
  document.querySelectorAll('.nav-inner button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');hSelect();
  // first time we land on pair view, make sure the list & month selects are populated
  if(v==='pair'){fillMonths();renderPairList();}
}

/* ============ toast ============ */
let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600);
}

/* ============ boot ============ */
function render(){
  evaluateStreak();
  document.getElementById('streakNum').textContent=S.streak;
  document.getElementById('freezeNum').textContent=S.freeze;
  if(S.drawnDate===today && S.drawnToday!==null){
    document.getElementById('moodPanel').style.display='none';
    document.getElementById('halo').classList.add('lit');
    fillFront(S.drawnToday);
    fillAdvice(S.drawnToday);
    // restore the card in arcanum view with the advice page primed on face A
    document.getElementById('faceBack').dataset.content='advice';
    document.getElementById('card').dataset.state='arcanum';
    showReading();
  }
  applyLang();renderAch();maybeAskName();
}
function boot(){
  tgReady();
  // prefill name from Telegram profile if available
  const tgUser=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user;
  // try to sync from Telegram cloud first, then render
  loadCloudThen(cloud=>{
    if(cloud){
      // cloud wins only if it has more progress than local
      const localDraws=(S.journal||[]).length;
      const cloudDraws=(cloud.journal||[]).length;
      if(cloudDraws>=localDraws) S=Object.assign({},defaultState,cloud);
    }
    LANG=S.lang||'uk';
    if(!S.name && tgUser && tgUser.first_name) S.name=tgUser.first_name;
    render();
  });
}
boot();
</script>
